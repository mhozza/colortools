[project]
name = "colortools-backend"
version = "0.1.0"
description = "Core backend engine for Photographic Color Harmony Assistant"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.10.0",
    "numpy>=2.0.0",
    "pillow>=11.0.0",
    "rawpy>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["domain", "services", "ports"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
