[project]
name = "colortools-web-server"
version = "0.1.0"
description = "Local FastAPI & WebSocket server for Photographic Color Harmony Assistant"
requires-python = ">=3.14"
dependencies = [
    "colortools-backend",
    "colortools-plugins",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "python-multipart>=0.0.12",
    "websockets>=13.0",
]

[tool.uv.sources]
colortools-backend = { workspace = true }
colortools-plugins = { workspace = true }

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["web_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
