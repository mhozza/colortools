[project]
name = "colortools-plugins"
version = "0.1.0"
description = "Plugin engine and photographic harmony analyzers for Photographic Color Harmony Assistant"
requires-python = ">=3.14"
dependencies = [
    "colortools-backend",
    "pydantic>=2.10.0",
    "numpy>=2.0.0",
    "defusedxml>=0.7.1",
]

[tool.uv.sources]
colortools-backend = { workspace = true }


[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core_harmonies", "lightroom_xmp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
